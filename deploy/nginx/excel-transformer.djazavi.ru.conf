# Хостовый nginx: проксирует домен на Docker frontend (порт 8082).
# Frontend-контейнер сам проксирует /api и /storage на backend.
#
# Установка:
#   sudo cp deploy/nginx/excel-transformer.djazavi.ru.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/excel-transformer.djazavi.ru.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS:
#   sudo certbot --nginx -d excel-transformer.djazavi.ru
#   После certbot обновите APP_URL в .env на https://excel-transformer.djazavi.ru
#   и пересоберите frontend: docker compose -f docker-compose.prod.yml up -d --build

upstream excel_transformer_frontend {
    server 127.0.0.1:8082;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name excel-transformer.djazavi.ru;

    client_max_body_size 32m;

    location / {
        proxy_pass http://excel_transformer_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
